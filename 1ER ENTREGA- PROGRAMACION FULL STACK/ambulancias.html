<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="css/style.css">
  <script src="js/app.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="main">
    <a href="index.html" class="btn btn-secondary">Volver</a>
    <h1>Panel de Gestión de Traslados</h1>
    
  <div class="card">
        <div class="row">
            <div class="col-md-6"><input id="origen" class="form-control mb-2" placeholder="Origen"></div>
            <div class="col-md-6"><input id="destino" class="form-control mb-2" placeholder="Destino"></div>
            <div class="col-md-6"><input id="chofer" class="form-control mb-2" placeholder="Nombre del Chofer"></div>
            <div class="col-md-6"><input id="enfermero" class="form-control mb-2" placeholder="Nombre del Enfermero"></div>
            <div class="col-md-12"><input id="paciente" class="form-control mb-2" placeholder="Paciente o Elemento a trasladar"></div>
            <div class="col-md-6"><input id="horaSalida" type="time" class="form-control mb-2" title="Hora de Salida"></div>
            <div class="col-md-6"><input id="horaLlegada" type="time" class="form-control mb-2" title="Hora Estimada de Llegada"></div>
        </div>
        <button class="btn btn-primary mt-2" onclick="registrarTraslado()">Registrar Traslado</button>
    </div>

    <div class="card">
        <table class="table">
            <thead><tr><th>Paciente/Elemento</th><th>Ruta</th><th>Personal</th><th>Estado</th></tr></thead>
            <tbody id="tablaBody"></tbody>
        </table>
      </div>
</div>
</body>
</html>
