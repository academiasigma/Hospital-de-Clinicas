services:
  sigsm_mariadb:
    image: mariadb:10.5
    container_name: sigsm_mariadb
    restart: always
    command: --server-id=1 --log-bin=mysql-bin --binlog-format=ROW
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: sigsm_hospital
      MYSQL_USER: sigsm_app
      MYSQL_PASSWORD: Hc1234_db
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql

  sigsm_mariadb_slave:
    image: mariadb:10.5
    container_name: sigsm_mariadb_slave
    restart: always
    command: --server-id=2 --read-only=1
    environment:
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - mariadb_slave_data:/var/lib/mysql

volumes:
  mariadb_data:
  mariadb_slave_data:
