services:
  sigsm_web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sigsm_web
    restart: always
    ports:
      - "8080:80"
    environment:
      DB_HOST: "sigsm_mariadb"
      DB_PORT: "3306"
      DB_NAME: "sigsm_hospital"
      DB_USER: "sigsm_app"
      DB_PASS: "Hc1234_db"
    depends_on:
      sigsm_mariadb:
        condition: service_healthy
    volumes:
      - uploads-volume:/var/www/html/uploads
    networks:
      - sigsm_net

  sigsm_mariadb:
    image: mariadb:10.5
    container_name: sigsm_mariadb
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: sigsm_hospital
      MYSQL_USER: sigsm_app
      MYSQL_PASSWORD: Hc1234_db
    ports:
      - "3306:3306"
    volumes:
      - db-volume:/var/lib/mysql
      - ./sigsm_db.sql:/docker-entrypoint-initdb.d/01-sigsm.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - sigsm_net

networks:
  sigsm_net:
    driver: bridge

volumes:
  db-volume:
  uploads-volume: